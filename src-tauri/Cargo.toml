[package]
name = "remora"
version = "0.1.0"
description = "Lightweight SSH Remote Workspace Desktop Client"
authors = ["Remora Team"]
edition = "2021"

[lib]
name = "remora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
rusqlite = { version = "0.33", features = ["bundled"] }
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
dirs = "6.0"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
russh = "0.63"
russh-sftp = "2.4"
async-trait = "0.1"
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "encryption"] }
