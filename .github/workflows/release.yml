name: Release Remora

# 仅支持手动触发 (Manual Trigger via workflow_dispatch Only)
'on':
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (optional, e.g. v0.1.13. Leave blank to auto-use package.json version)'
        required: false
        default: ''
      target:
        description: 'Build target (all / android / desktop)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - android
          - desktop

jobs:
  build-desktop:
    if: github.event.inputs.target != 'android'
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: '--bundles deb,appimage'
            target: 'x86_64-unknown-linux-gnu'
          - platform: 'windows-latest'
            args: '--bundles msi,nsis'
            target: 'x86_64-pc-windows-msvc'
          - platform: 'macos-latest'
            args: '--bundles dmg'
            target: 'aarch64-apple-darwin,x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    outputs:
      release_tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine Version and Tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            PKG_VER=$(jq -r '.version // empty' package.json 2>/dev/null || node -p "require('./package.json').version" 2>/dev/null || grep -m1 '"version"' src-tauri/tauri.conf.json | cut -d'"' -f4)
            TAG="v${PKG_VER#v}"
          fi
          [[ "$TAG" =~ ^v ]] || TAG="v$TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Determined release tag: $TAG"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev file libfuse2 || sudo apt-get install -y libfuse2t64

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build and Package with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ steps.vars.outputs.tag }}
          releaseName: 'Remora ${{ steps.vars.outputs.tag }}'
          releaseBody: |
            See the assets below to download and install Remora across all supported platforms (Linux, Windows, macOS, Android).
            
            ### Linux (Ubuntu / Debian):
            ```bash
            sudo dpkg -i remora_*_amd64.deb
            # or
            sudo apt install ./remora_*_amd64.deb
            ```
            
            ### Linux (Universal AppImage):
            ```bash
            chmod +x remora_*.AppImage
            ./remora_*.AppImage
            ```
            
            ### Windows (x64):
            Download the NSIS setup installer (`remora_*_x64-setup.exe`) or Windows Installer (`remora_*_x64_en-US.msi`) and run to install.
            
            ### macOS (Apple Silicon & Intel):
            Download the Apple Disk Image (`remora_*_universal.dmg` or `remora_*_aarch64.dmg`), open it, and drag Remora to Applications.
            
            ### Mobile Android (手机端):
            Download the Android APK (`remora-*-v*.apk`) directly to your mobile device and tap to install.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          args: ${{ matrix.args }} ${{ secrets.TAURI_SIGNING_PRIVATE_KEY == '' && '--no-sign' || '' }}

  build-android:
    if: github.event.inputs.target != 'desktop'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine Version and Tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            PKG_VER=$(jq -r '.version // empty' package.json 2>/dev/null || node -p "require('./package.json').version" 2>/dev/null || grep -m1 '"version"' src-tauri/tauri.conf.json | cut -d'"' -f4)
            TAG="v${PKG_VER#v}"
          fi
          [[ "$TAG" =~ ^v ]] || TAG="v$TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Determined release tag: $TAG"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        run: |
          if [ -z "${NDK_HOME:-}" ] || [ ! -d "${NDK_HOME:-}" ]; then
            EXISTING_NDK=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -n 1 || true)
            if [ -n "$EXISTING_NDK" ] && [ -d "$EXISTING_NDK" ]; then
              echo "Found pre-installed NDK at $EXISTING_NDK"
              echo "NDK_HOME=$EXISTING_NDK" >> $GITHUB_ENV
            else
              echo "Installing NDK 26.1.10909125..."
              echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"
              echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
            fi
          fi

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Android APK
        run: |
          ./build.sh --apk --no-bump

      - name: Upload Android APKs to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: 'Remora ${{ steps.vars.outputs.tag }}'
          files: |
            release/android/*.apk
            release/android/SHA256SUMS.txt
